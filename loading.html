<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    font-family: Arial, sans-serif;
    background-color: #121212;
    background-image: linear-gradient(#2a2a2a 1px, transparent 1px),
                      linear-gradient(90deg, #2a2a2a 1px, transparent 1px);
    background-size: 40px 40px;
    color: #fff;
    overflow: hidden;
  }

  .loading-box {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 40px;
    border: 2px solid #fff;
    border-radius: 12px;
    background-color: rgba(20,20,20,0.95);
    box-shadow: 0 0 20px #fff;
    text-align: center;
    z-index: 10;
    animation: boxPulse 6s infinite alternate;
  }

  @keyframes boxPulse {
    0% { box-shadow: 0 0 15px #fff; }
    50% { box-shadow: 0 0 25px #fff; }
    100% { box-shadow: 0 0 15px #fff; }
  }

  h2 { margin-bottom: 20px; font-size: 1.5rem; }

  .loading-bar {
    width: 200px;
    height: 20px;
    border-radius: 10px;
    background-color: #1e1e1e;
    overflow: hidden;
    margin: 0 auto;
    border: 1px solid #555;
  }

  .loader {
    height: 100%;
    width: 0;
    background-color: #fff;
    border-radius: 10px;
    animation: fillBar 5s linear forwards;
  }

  @keyframes fillBar { from{width:0} to{width:100%} }

  iframe {
    position: absolute;
    top:0;
    left:0;
    width: 100%;
    height: 100%;
    border: none;
    display: none; /* hidden until loader finishes */
  }
</style>
</head>
<body>
<div class="loading-box">
  <h2>Please wait for the page to load</h2>
  <div class="loading-bar"><div class="loader"></div></div>
</div>

<iframe id="gameFrame"></iframe>

<script>
const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789~^&!@#$%*';
const validPages = ['v1', 'v2'];

// Read original URL
const url = new URL(window.location.href);
let page = url.searchParams.get('page');

// If page missing or invalid → go 404
if (!page || !validPages.includes(page.split('/')[0])) {
  window.location.replace('404.html');
  throw new Error('Invalid page');
}

// Always clean the URL first (removes stacked junk)
page = page.split('/')[0];
history.replaceState(null, '', `loading.html?page=${page}`);

// Random generator
function randomSegment(len = 4) {
  return Array.from({ length: len }, () =>
    chars[Math.floor(Math.random() * chars.length)]
  ).join('');
}

// Randomize path (REPLACES, never appends)
const interval = setInterval(() => {
  const rand = `${randomSegment()}-${randomSegment()}`;
  history.replaceState(null, '', `loading.html?page=${page}/${rand}`);
}, 60);

// After 5 seconds load the game
setTimeout(() => {
  clearInterval(interval);

  // Reset URL clean before showing game
  history.replaceState(null, '', `loading.html?page=${page}`);

  document.querySelector('.loading-box').style.display = 'none';

  const iframe = document.getElementById('gameFrame');
  iframe.style.display = 'block';
  iframe.src = `${page}.html`;
}, 5000);
</script>
</body>
</html>
