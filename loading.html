<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: #121212;
    background-image: 
      linear-gradient(#2a2a2a 1px, transparent 1px),
      linear-gradient(90deg, #2a2a2a 1px, transparent 1px);
    background-size: 40px 40px;
    font-family: Arial, sans-serif;
    color: #fff;
    animation: bgPulse 10s infinite alternate;
  }

  @keyframes bgPulse {
    0% { background-color: #121212; }
    50% { background-color: #101010; }
    100% { background-color: #121212; }
  }

  .loading-box {
    padding: 40px;
    border: 2px solid #fff;
    border-radius: 12px;
    background-color: rgba(20, 20, 20, 0.9);
    box-shadow: 0 0 20px #fff;
    text-align: center;
  }

  h2 {
    margin-bottom: 20px;
    font-size: 1.5rem;
    text-shadow: 0 0 8px #fff, 0 0 16px #fff;
    animation: glow 2s infinite alternate;
  }

  @keyframes glow {
    0% { text-shadow: 0 0 4px #fff, 0 0 8px #fff; }
    50% { text-shadow: 0 0 12px #fff, 0 0 24px #fff; }
    100% { text-shadow: 0 0 4px #fff, 0 0 8px #fff; }
  }

  .loading-bar {
    width: 200px;
    height: 20px;
    border: 1px solid #555;
    border-radius: 8px;
    background-color: #1e1e1e;
    overflow: hidden;
    margin: 0 auto;
    position: relative;
  }

  .loader {
    width: 20px;
    height: 100%;
    background-color: #fff;
    animation: jump 0.5s infinite steps(1);
  }

  @keyframes jump {
    0% { left: 0; }
    25% { left: 40px; }
    50% { left: 80px; }
    75% { left: 120px; }
    100% { left: 160px; }
  }
</style>
<script>
  // Redirect after 5 seconds
  setTimeout(() => {
    // Here you could randomly send to v1 or v2, or a specific page
    window.location.href = "v1.html";
  }, 5000);
</script>
</head>
<body>
  <div class="loading-box">
    <h2>Please wait for the page to load</h2>
    <div class="loading-bar">
      <div class="loader"></div>
    </div>
  </div>
</body>
</html>
