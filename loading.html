<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background-color:#121212;
  background-image: linear-gradient(#2a2a2a 1px, transparent 1px),
                    linear-gradient(90deg, #2a2a2a 1px, transparent 1px);
  background-size: 40px 40px;
  font-family: Arial, sans-serif;
  color: #fff;
}
.loading-box {
  padding:40px;
  border:2px solid #fff;
  border-radius:12px;
  background-color: rgba(20,20,20,0.9);
  box-shadow:0 0 20px #fff;
  text-align:center;
  animation: boxPulse 6s infinite alternate;
}
@keyframes boxPulse {
  0% { box-shadow:0 0 15px #fff; }
  50% { box-shadow:0 0 25px #fff; }
  100% { box-shadow:0 0 15px #fff; }
}
h2 { margin-bottom:20px; font-size:1.5rem; }
.loading-bar {
  width:200px;
  height:20px;
  border-radius:10px;
  background-color:#1e1e1e;
  overflow:hidden;
  margin:0 auto;
  border:1px solid #555;
}
.loader {
  height:100%;
  width:0;
  background-color:#fff;
  border-radius:10px;
  animation:fillBar 5s linear forwards;
}
@keyframes fillBar {
  from { width:0; }
  to { width:100%; }
}
</style>
</head>
<body>
<div class="loading-box">
  <h2>Please wait for the page to load</h2>
  <div class="loading-bar"><div class="loader"></div></div>
</div>

<script>
const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789~^&!@#$%*';

// Get page and token from URL
const params = new URLSearchParams(window.location.search);
const page = params.get('page')?.split('/')[0] || 'v1';
const token = params.get('token');

// If no token, go to 404
if(!token){
    window.location.href = '404.html';
}

// Randomize URL every 60ms for effect
function randomSegment(len=4){
    return Array.from({length:len},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
}
const interval = setInterval(()=>{
    history.replaceState(null,'',`loading.html?page=${page}/${randomSegment()}-${randomSegment()}&token=${token}`);
},60);

// Redirect after 5 seconds
setTimeout(()=>{
    clearInterval(interval);
    window.location.href = `${page}.html?token=${token}`;
},5000);
</script>
</body>
</html>
