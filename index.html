<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ROT Decoder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grid-bg"></div>

  <main class="app">
    <h1 class="title">ROT Decoder</h1>
    <p class="subtitle">Decode ROT1 → ROT25 instantly</p>

    <textarea id="input" placeholder="Enter text here..."></textarea>

    <div class="controls">
      <label for="rot">Rotation</label>
      <input type="range" id="rot" min="1" max="25" value="13">
      <span id="rotValue">13</span>
    </div>

    <div class="output-box">
      <h2>Decoded Output</h2>
      <pre id="output"></pre>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
