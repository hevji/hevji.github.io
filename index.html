<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROT Cipher Tool</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background-color: #121212;
    background-image:
      linear-gradient(#2a2a2a 1px, transparent 1px),
      linear-gradient(90deg, #2a2a2a 1px, transparent 1px);
    background-size: 40px 40px;

    font-family: Arial, sans-serif;
    color: #fff;
  }

  h1 {
    font-size: 3rem;
    margin-bottom: 10px;
  }

  p {
    opacity: 0.8;
    margin-bottom: 10px;
  }

  textarea {
    width: 340px;
    height: 95px;
    margin: 10px 0;
    padding: 10px;

    background: #1e1e1e;
    color: #fff;

    border: 1px solid #555;
    border-radius: 8px;

    resize: none;
    outline: none;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }

  button {
    padding: 10px 18px;

    border: 1px solid #555;
    border-radius: 8px;

    background-color: #1e1e1e;
    color: #fff;

    font-weight: bold;
    cursor: pointer;

    box-shadow: 0 0 15px #fff;
    transition: 0.2s;
  }

  button:hover {
    box-shadow: 0 0 20px #fff;
    border-color: #fff;
  }

  .active {
    border-color: #fff;
    box-shadow: 0 0 25px #fff;
  }

  .slider-box {
    margin-top: 15px;
    text-align: center;
  }

  input[type="range"] {
    width: 260px;
  }

  .rot-value {
    margin-top: 5px;
    font-size: 0.9rem;
    opacity: 0.8;
  }
</style>
</head>

<body>

  <h1>ROT Cipher</h1>
  <p>Shift letters with a custom rotation</p>

  <textarea id="input" placeholder="Enter text..."></textarea>

  <div class="controls">
    <button id="toggleBtn" onclick="toggleMode()">Mode: Decode</button>
    <button onclick="process()">Run</button>
  </div>

  <div class="slider-box">
    <input type="range" id="rotSlider" min="1" max="25" value="13">
    <div class="rot-value">ROT: <span id="rotVal">13</span></div>
  </div>

  <textarea id="output" placeholder="Result..." readonly></textarea>

<script>
let mode = "decode";

const input = document.getElementById("input");
const output = document.getElementById("output");
const slider = document.getElementById("rotSlider");
const rotVal = document.getElementById("rotVal");

function rotate(str, shift) {
  return str.replace(/[a-zA-Z]/g, c => {
    const base = c <= 'Z' ? 65 : 97;
    return String.fromCharCode((c.charCodeAt(0) - base + shift + 26) % 26 + base);
  });
}

function process() {
  let shift = parseInt(slider.value);

  if (mode === "decode") shift = -shift;

  output.value = rotate(input.value, shift);
}

function toggleMode() {
  mode = mode === "decode" ? "encode" : "decode";
  const btn = document.getElementById("toggleBtn");

  btn.textContent = "Mode: " + (mode === "decode" ? "Decode" : "Encode");
  btn.classList.toggle("active");

  process();
}

// live update while typing
input.addEventListener("input", process);

// live update while sliding
slider.addEventListener("input", () => {
  rotVal.textContent = slider.value;
  process();
});
</script>

</body>
</html>
