<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Webhook Deleter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated grid background */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(88, 101, 242, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(88, 101, 242, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }

        /* Glow orbs */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            pointer-events: none;
            animation: float 15s ease-in-out infinite;
        }

        .glow-orb-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #5865f2, transparent);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .glow-orb-2 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #eb459e, transparent);
            bottom: 15%;
            right: 15%;
            animation-delay: 3s;
        }

        .glow-orb-3 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #5865f2, transparent);
            top: 50%;
            left: 50%;
            animation-delay: 6s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(88, 101, 242, 0.2);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(88, 101, 242, 0.1),
                inset 0 0 60px rgba(88, 101, 242, 0.05);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #5865f2, #eb459e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(88, 101, 242, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(88, 101, 242, 0.8));
            }
        }

        .header p {
            color: #a0a0b0;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #b0b0c0;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(30, 30, 45, 0.6);
            border: 1px solid rgba(88, 101, 242, 0.3);
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            background: rgba(30, 30, 45, 0.8);
            border-color: #5865f2;
            box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.1);
        }

        input::placeholder {
            color: #606070;
        }

        .button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #5865f2, #4752c4);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .button:hover::before {
            width: 300px;
            height: 300px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .button span {
            position: relative;
            z-index: 1;
        }

        .status {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            animation: fadeIn 0.3s ease;
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status.success {
            background: rgba(67, 181, 129, 0.1);
            border: 1px solid rgba(67, 181, 129, 0.3);
            color: #43b581;
            display: block;
        }

        .status.error {
            background: rgba(240, 71, 71, 0.1);
            border: 1px solid rgba(240, 71, 71, 0.3);
            color: #f04747;
            display: block;
        }

        .status.info {
            background: rgba(88, 101, 242, 0.1);
            border: 1px solid rgba(88, 101, 242, 0.3);
            color: #5865f2;
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #606070;
        }

        .warning {
            background: rgba(250, 166, 26, 0.1);
            border: 1px solid rgba(250, 166, 26, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #faa61a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .warning::before {
            content: '⚠️';
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>

    <div class="container">
        <div class="header">
            <h1>Discord Webhook Deleter</h1>
            <p>Securely remove Discord webhooks</p>
        </div>

        <div class="warning">
            This action is permanent and cannot be undone.
        </div>

        <form id="deleteForm">
            <div class="form-group">
                <label for="webhookUrl">Webhook URL</label>
                <input 
                    type="text" 
                    id="webhookUrl" 
                    placeholder="https://discord.com/api/webhooks/..." 
                    required
                >
            </div>

            <button type="submit" class="button" id="deleteBtn">
                <span>Delete Webhook</span>
            </button>
        </form>

        <div id="status" class="status"></div>

        <div class="footer">
            Made with modern web technologies
        </div>
    </div>

    <script>
        const form = document.getElementById('deleteForm');
        const webhookInput = document.getElementById('webhookUrl');
        const deleteBtn = document.getElementById('deleteBtn');
        const statusDiv = document.getElementById('status');

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
        }

        function hideStatus() {
            statusDiv.style.display = 'none';
        }

        function validateWebhookUrl(url) {
            const webhookPattern = /^https:\/\/(discord\.com|discordapp\.com)\/api\/webhooks\/\d+\/[\w-]+$/;
            return webhookPattern.test(url);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const webhookUrl = webhookInput.value.trim();
            
            // Validate URL
            if (!validateWebhookUrl(webhookUrl)) {
                showStatus('Invalid webhook URL format', 'error');
                return;
            }

            // Disable button and show loading
            deleteBtn.disabled = true;
            deleteBtn.innerHTML = '<span><span class="loading-spinner"></span>Deleting...</span>';
            hideStatus();

            try {
                const response = await fetch(webhookUrl, {
                    method: 'DELETE'
                });

                if (response.ok || response.status === 204) {
                    showStatus('✓ Webhook deleted successfully!', 'success');
                    webhookInput.value = '';
                } else if (response.status === 404) {
                    showStatus('Webhook not found or already deleted', 'error');
                } else if (response.status === 401 || response.status === 403) {
                    showStatus('Unauthorized - Invalid webhook URL', 'error');
                } else {
                    showStatus(`Failed to delete webhook (Status: ${response.status})`, 'error');
                }
            } catch (error) {
                showStatus('Network error - Please check your connection', 'error');
                console.error('Error:', error);
            } finally {
                deleteBtn.disabled = false;
                deleteBtn.innerHTML = '<span>Delete Webhook</span>';
            }
        });

        // Clear status on input change
        webhookInput.addEventListener('input', () => {
            if (statusDiv.style.display === 'block') {
                hideStatus();
            }
        });
    </script>
</body>
</html>
