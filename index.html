<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Loader</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: #121212;
    background-image: 
      linear-gradient(#2a2a2a 1px, transparent 1px),
      linear-gradient(90deg, #2a2a2a 1px, transparent 1px);
    background-size: 40px 40px;
    font-family: Arial, sans-serif;
    color: #fff;
  }

  h1 {
    margin-bottom: 30px;
    font-size: 2rem;
  }

  .button-box {
    padding: 40px;
    border: 2px solid #fff; /* White outline */
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    background-color: rgba(20, 20, 20, 0.9);
    box-shadow: 0 0 20px #fff; /* White glow around box */
  }

  .btn {
    padding: 15px 30px;
    border: 1px solid #555;
    border-radius: 8px;
    background-color: #1e1e1e;
    color: #fff;
    text-decoration: none;
    text-align: center;
    font-weight: bold;
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .btn:hover {
    box-shadow: 0 0 15px #fff; /* White glow on hover */
    border-color: #fff;
  }
</style>
</head>
<body>
  <h1>MC Loader</h1> <!-- Change this to whatever you like -->
  <div class="button-box">
    <a href="v1.html" class="btn">Go to V1 [1.5.2] (broken)</a>
    <a href="v2.html" class="btn">Go to V2 [1.8]</a>
  </div>
</body>
</html>
