<!DOCTYPE html>
<html>
<head>
    <title>ROT13 Decoder</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding: 40px;
        }

        textarea {
            width: 300px;
            height: 100px;
            margin: 10px 0;
        }

        button {
            padding: 6px 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>ROT13 Decoder</h2>

    <textarea id="input" placeholder="Enter text..."></textarea><br>

    <button onclick="decode()">Decode</button>

    <br><br>

    <textarea id="output" placeholder="Result..." readonly></textarea>

    <script>
        function rot13(str) {
            return str.replace(/[a-zA-Z]/g, function(c) {
                const base = c <= 'Z' ? 65 : 97;
                return String.fromCharCode((c.charCodeAt(0) - base + 13) % 26 + base);
            });
        }

        function decode() {
            const text = document.getElementById("input").value;
            document.getElementById("output").value = rot13(text);
        }
    </script>

</body>
</html>
