<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>URL Randomizer Active</title>

<!-- Forceer dat elke directe load een 404 blijft -->
<meta http-equiv="refresh" content="0;url=/" />
</head>
<body>
<h1>URL Randomizer Active</h1>

<script>
(() => {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  const blockLength = 4;
  const intervalMs = 10;

  function randomBlock() {
    let out = "";
    for (let i = 0; i < blockLength; i++) {
      out += chars[Math.floor(Math.random() * chars.length)];
    }
    return out;
  }

  function generatePath() {
    return `/${randomBlock()}-${randomBlock()}`;
  }

  // Blijft ALTIJD draaien
  setInterval(() => {
    history.replaceState(null, "", generatePath());
  }, intervalMs);

  // Kill ALLE navigatie
  const block = e => {
    e.preventDefault();
    e.stopPropagation();
    return false;
  };

  ["click", "mousedown", "mouseup", "keydown", "keypress", "keyup"].forEach(evt => {
    document.addEventListener(evt, block, true);
  });

  // Extra bescherming tegen link-focus / enter
  window.addEventListener("beforeunload", e => {
    e.preventDefault();
    e.returnValue = "";
  });
})();
</script>
</body>
</html>
