<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Random URL Path</title>
</head>
<body>
<h1>Random URL Path Demo</h1>
<script>
(() => {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
  const blockLength = 4;
  const intervalMs = 50; // slightly slower for browser safety

  function randomBlock() {
    let out = "";
    for (let i = 0; i < blockLength; i++) {
      out += chars[Math.floor(Math.random() * chars.length)];
    }
    return out;
  }

  function generatePath() {
    return `#${randomBlock()}-${randomBlock()}`; // use hash instead of path
  }

  setInterval(() => {
    try {
      location.hash = generatePath(); // safer for GitHub Pages
    } catch (_) {}
  }, intervalMs);
})();
</script>
</body>
</html>
