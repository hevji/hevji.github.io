<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROT Cipher Tool</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background-color: #121212;
    background-image:
      linear-gradient(#2a2a2a 1px, transparent 1px),
      linear-gradient(90deg, #2a2a2a 1px, transparent 1px);
    background-size: 40px 40px;

    font-family: Arial, sans-serif;
    color: #fff;
  }

  h1 {
    font-size: 3rem;
    margin-bottom: 8px;
  }

  p {
    opacity: 0.75;
    margin-bottom: 12px;
  }

  textarea {
    width: 340px;
    height: 95px;
    margin: 10px 0;
    padding: 10px;

    background: #1e1e1e;
    color: #fff;

    border: 1px solid #444;
    border-radius: 8px;

    resize: none;
    outline: none;

    /* soft glow */
    box-shadow: 0 0 10px rgba(255,255,255,0.18);
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }

  textarea:focus {
    border-color: #888;
    box-shadow: 0 0 16px rgba(255,255,255,0.18);
  }

  .slider-box {
    margin-top: 12px;
    padding: 14px 18px;

    border-radius: 10px;

    background: #1b1b1b;

    /* soft container glow */
    box-shadow: 0 0 14px rgba(255,255,255,0.07);
  }

  input[type="range"] {
    width: 260px;
  }

  .rot-value {
    margin-top: 6px;
    font-size: 0.9rem;
    opacity: 0.8;
  }
</style>
</head>

<body>

  <h1>ROT Cipher</h1>
  <p>Slide to change the rotation</p>

  <textarea id="input" placeholder="Enter text..."></textarea>

  <div class="slider-box">
    <input type="range" id="rotSlider" min="1" max="25" value="13">
    <div class="rot-value">ROT: <span id="rotVal">13</span></div>
  </div>

  <textarea id="output" placeholder="Result..." readonly></textarea>

<script>
const input = document.getElementById("input");
const output = document.getElementById("output");
const slider = document.getElementById("rotSlider");
const rotVal = document.getElementById("rotVal");

function rotate(str, shift) {
  return str.replace(/[a-zA-Z]/g, c => {
    const base = c <= 'Z' ? 65 : 97;
    return String.fromCharCode((c.charCodeAt(0) - base + shift) % 26 + base);
  });
}

function process() {
  const shift = parseInt(slider.value);
  output.value = rotate(input.value, shift);
}

// live update
input.addEventListener("input", process);

slider.addEventListener("input", () => {
  rotVal.textContent = slider.value;
  process();
});
</script>

</body>
</html>
