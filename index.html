<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Base64 Encoder / Decoder</title>
<style>
    body {
        background: #111;
        color: #eee;
        font-family: Arial, sans-serif;
        padding: 40px;
    }
    textarea {
        width: 100%;
        height: 100px;
        margin: 10px 0;
        background: #222;
        color: #fff;
        border: 1px solid #444;
        padding: 10px;
        font-size: 16px;
    }
    button {
        background: #444;
        color: #fff;
        border: none;
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
        font-size: 16px;
    }
    button:hover {
        background: #666;
    }
</style>
</head>
<body>
<h1>Base64 Encoder / Decoder</h1>

<textarea id="inputText" placeholder="Enter text here..."></textarea>
<br>
<button onclick="encodeBase64()">Encode</button>
<button onclick="decodeBase64()">Decode</button>
<br>
<textarea id="outputText" placeholder="Result..." readonly></textarea>

<script>
function encodeBase64() {
    const input = document.getElementById('inputText').value;
    try {
        const encoded = btoa(unescape(encodeURIComponent(input)));
        document.getElementById('outputText').value = encoded;
    } catch (e) {
        document.getElementById('outputText').value = "Error: Invalid input";
    }
}

function decodeBase64() {
    const input = document.getElementById('inputText').value;
    try {
        const decoded = decodeURIComponent(escape(atob(input)));
        document.getElementById('outputText').value = decoded;
    } catch (e) {
        document.getElementById('outputText').value = "Error: Invalid Base64";
    }
}
</script>
</body>
</html>
