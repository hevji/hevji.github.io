<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DOWNLOAD</title>
</head>
<body>
<h1>hi</h1>

<script>
(() => {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  const blockLength = 10;
  const intervalMs = 13;

  function randomBlock() {
    let out = "";
    for (let i = 0; i < blockLength; i++) {
      out += chars[Math.floor(Math.random() * chars.length)];
    }
    return out;
  }

  function generatePath() {
    return `/${randomBlock()}-${randomBlock()}`;
  }

  let running = true;

  function loop() {
    if (!running) return;

    try {
      history.replaceState(null, "", generatePath());
    } catch (_) {}

    setTimeout(loop, intervalMs);
  }

  // Start loop
  loop();

  // If browser tries to pause it (tab focus / visibility changes), restart
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      loop();
    }
  });

  // Block link clicks
  document.addEventListener("click", e => {
    if (e.target.tagName === "A") e.preventDefault();
  });

  // Extra protection: restart every 5 seconds just in case
  setInterval(() => {
    loop();
  }, 5000);
})();
</script>

</body>
</html>
