<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>YouTube Downloader</title>
<style>
  body {
    background: #0f0f0f;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    align-items: center;
    justify-content: center;
  }

  .box {
    background: #1a1a1a;
    padding: 20px;
    border-radius: 8px;
    width: 320px;
  }

  input {
    width: 100%;
    padding: 10px;
    background: #111;
    border: 1px solid #333;
    color: #fff;
    border-radius: 4px;
    margin-bottom: 10px;
  }

  button {
    width: 100%;
    padding: 10px;
    background: #3b82f6;
    border: none;
    color: #fff;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover {
    background: #2563eb;
  }

  .status {
    margin-top: 10px;
    font-size: 14px;
    opacity: 0.8;
  }
</style>
</head>
<body>

<div class="box">
  <input id="url" placeholder="YouTube URL" />
  <button onclick="download()">Download</button>
  <div class="status" id="status"></div>
</div>

<script>
async function download() {
  const url = document.getElementById("url").value;
  const status = document.getElementById("status");

  status.textContent = "Downloading...";

  const res = await fetch("http://localhost:5000/download", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url })
  });

  const data = await res.json();

  status.textContent = data.status || data.error;
}
</script>

</body>
</html>
