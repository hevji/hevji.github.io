<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>URL Blocker Demo</title>
</head>
<body>
<h1>URL Randomizer Active</h1>
<script>
(() => {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  const blockLength = 4;
  const intervalMs = 10; // very fast, but not 1ms

  function randomBlock() {
    let out = "";
    for (let i = 0; i < blockLength; i++) {
      out += chars[Math.floor(Math.random() * chars.length)];
    }
    return out;
  }

  function generatePath() {
    return `/${randomBlock()}-${randomBlock()}`;
  }

  setInterval(() => {
    try {
      history.replaceState(null, "", generatePath());
    } catch (_) {}
  }, intervalMs);

  // Optional: prevent default click on links so users can’t navigate
  document.addEventListener("click", e => {
    if (e.target.tagName === "A") e.preventDefault();
  });
})();
</script>
</body>
</html>
