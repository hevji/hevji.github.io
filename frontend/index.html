<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Music Downloader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="card">
  <h1>🎧 Music Downloader</h1>
  <p class="sub">Spotify → YouTube Music • Ad-free</p>

  <select id="mode">
    <option value="spotify">Spotify link</option>
    <option value="ytmusic">YouTube Music search</option>
  </select>

  <input id="input" placeholder="Paste link or search…" />

  <select id="format">
    <option value="mp3">MP3</option>
    <option value="flac">FLAC</option>
    <option value="opus">OPUS</option>
  </select>

  <input id="duration" type="number" placeholder="Duration (sec, optional)" />

  <button onclick="download()">Download</button>

  <p id="status"></p>
</div>

<script src="app.js"></script>
</body>
</html>
